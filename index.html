<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Coach: build ideas for your play couch</title>
<meta name="description" content="Build ideas for a play couch and its round add-on: cars, forts and slides, shown going together piece by piece, with a printable sheet.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/gallery.css">
<link rel="stylesheet" href="css/tracker.css">
</head>
<body>
<div class="wrap" id="page">
  <header id="top"></header>
  <div class="intro">
    <h1 id="headline">Build ideas for your play couch</h1>
    <p class="sub" id="sub">Cars, forts and slides. Free. Tap one to see it go together piece by piece.</p>
    <p class="small" id="fits"></p>
  </div>
  <div id="setup"></div>
  <div id="seen"></div>
  <div class="filter">
    <div class="filter-in">
      <div class="chips" id="themes" role="radiogroup" aria-label="Theme"></div>
      <div class="status"><span id="count" aria-live="polite"></span><button class="linkish" type="button" id="change">Change set-up</button></div>
    </div>
  </div>
  <main id="list"></main>
  <p class="explain" id="explain"></p>
</div>
<script type="module">
  import { initGallery } from './js/gallery.js';
  initGallery();
</script>
</body>
</html>
